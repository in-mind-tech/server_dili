<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Dilitafi Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/admin.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-warning">
  <div class="container-fluid">
    <a class="navbar-brand text-warning fw-bold" href="/admin/dashboard">
      <i class="bi bi-film"></i> Dilitafi Admin
    </a>
    {% if admin %}
    <div class="d-flex gap-2">
      <a href="/admin/genres" class="btn btn-outline-warning btn-sm">Genres</a>
      <a href="/admin/dashboard" class="btn btn-outline-warning btn-sm">Films</a>
      <span class="navbar-text text-light mx-3">{{ admin.email }}</span>
      <a href="/auth/logout" class="btn btn-danger btn-sm">Déconnexion</a>
    </div>
    {% endif %}
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
