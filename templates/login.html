<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Connexion Admin - Dilitafi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height:100vh">
<div class="container" style="max-width:420px">
  <div class="card shadow-lg">
    <div class="card-body p-4">
      <h3 class="mb-4 text-center">Dilitafi Admin</h3>
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/login-form">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-warning w-100">Se connecter</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
